name: CI

on:
  push:
    branches-ignore:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: src

jobs:
  ai_guardrails:
    name: ai_guardrails
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enforce AI provider mock-only in CI
        run: |
          grep -q '^AI_PROVIDER=mock$' .env.ci
          grep -q '^GEMINI_API_KEY=$' .env.ci

  npm_audit_guard:
    name: npm_audit_guard
    runs-on: ubuntu-latest
    needs: [ai_guardrails]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Node/npm versions
        run: |
          node --version
          npm --version

      - name: Install npm dependencies
        run: npm ci

      - name: npm audit prod-only (high/critical gate)
        run: npm audit --omit=dev --audit-level=high

  pint:
    name: pint
    runs-on: ubuntu-latest
    needs: [ai_guardrails, npm_audit_guard]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP 8.5
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2
          extensions: mbstring, intl, pdo_sqlite, sqlite3, dom, curl, xml, zip, bcmath

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Pint analyze
        run: vendor/bin/pint --config pint.json --test .

  phpstan:
    name: phpstan
    runs-on: ubuntu-latest
    needs: [ai_guardrails, npm_audit_guard]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP 8.5
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2
          extensions: mbstring, intl, pdo_sqlite, sqlite3, dom, curl, xml, zip, bcmath

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: PHPStan
        run: vendor/bin/phpstan analyse --no-progress

  pest_acceptance:
    name: pest_acceptance
    runs-on: ubuntu-latest
    needs: [ai_guardrails, npm_audit_guard]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP 8.5
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2
          extensions: mbstring, intl, pdo_sqlite, sqlite3, dom, curl, xml, zip, bcmath

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare CI environment
        run: |
          cp .env.ci .env
          php artisan key:generate --ansi --force
          php artisan config:clear --ansi

      - name: Run acceptance tests
        env:
          AI_PROVIDER: mock
          AI_MOCK_DELAY: 0
        run: vendor/bin/pest --testsuite=Acceptance --colors=never

  pest_coverage:
    name: pest_coverage
    runs-on: ubuntu-latest
    needs: [ai_guardrails, npm_audit_guard]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP 8.5 + Xdebug
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: xdebug
          tools: composer:v2
          extensions: mbstring, intl, pdo_sqlite, sqlite3, dom, curl, xml, zip, bcmath

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare CI environment
        run: |
          cp .env.ci .env
          php artisan key:generate --ansi --force
          php artisan config:clear --ansi

      - name: Run tests with coverage gate
        run: |
          mkdir -p coverage-report
          vendor/bin/pest --coverage --coverage-clover=coverage-report/clover.xml --coverage-html=coverage-report/html --min=95

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: src/coverage-report
          retention-days: 7

      - name: Upload to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: src/coverage-report/clover.xml
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}

